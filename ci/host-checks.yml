name: Host checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q device scripts tests
      - run: python -m unittest discover -s tests -p 'test_host.py'
      - run: python scripts/check_repo.py
      - run: python scripts/prepare.py --only models
      - run: python scripts/check_native.py --reference-only
